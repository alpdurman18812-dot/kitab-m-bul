<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KİTABIMIBUL</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1e1c18] text-stone-100 min-h-screen font-['Plus_Jakarta_Sans'] p-3 pb-16 antialiased select-none">

  <!-- Arama Çubuğu -->
  <div class="sticky top-2 z-20 bg-stone-900/95 backdrop-blur border border-stone-800 p-2 rounded-2xl flex gap-2 shadow-2xl mb-3">
    <input type="text" id="q-input" placeholder="Kitap adı, yazar veya konu yaz..." class="flex-1 bg-stone-800 border-none rounded-xl px-3.5 text-xs text-stone-100 focus:outline-none placeholder-stone-500">
    <button onclick="doSearch()" class="px-4 py-2 bg-red-900 hover:bg-red-800 text-white rounded-xl text-xs font-bold shadow transition active:scale-95">Bul</button>
  </div>

  <!-- Kategori Butonları -->
  <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-2 mb-2 text-xs">
    <button onclick="quickSearch('Beyza Alkoç')" class="px-3 py-1.5 bg-gradient-to-r from-pink-500 to-rose-400 text-white font-bold rounded-xl whitespace-nowrap shadow active:scale-95">💖 Gençlik & Wattpad</button>
    <button onclick="quickSearch('İradeyi Terbiye Etmek')" class="px-3 py-1.5 bg-stone-800 text-stone-300 rounded-xl whitespace-nowrap active:scale-95">İrade & Disiplin</button>
    <button onclick="quickSearch('Marcus Aurelius Stoacılık')" class="px-3 py-1.5 bg-stone-800 text-stone-300 rounded-xl whitespace-nowrap active:scale-95">Felsefe</button>
    <button onclick="quickSearch('Beyaz Zambaklar Ülkesinde')" class="px-3 py-1.5 bg-stone-800 text-stone-300 rounded-xl whitespace-nowrap active:scale-95">Tarih & Strateji</button>
    <button onclick="quickSearch('Suç ve Ceza Dostoyevski')" class="px-3 py-1.5 bg-stone-800 text-stone-300 rounded-xl whitespace-nowrap active:scale-95">Dünya Klasikleri</button>
    <button onclick="quickSearch('Agatha Christie Polisiye')" class="px-3 py-1.5 bg-stone-800 text-stone-300 rounded-xl whitespace-nowrap active:scale-95">Polisiye</button>
  </div>

  <div id="status" class="text-[11px] text-stone-400 mb-3 px-1 font-medium">Kitaplar taranıyor...</div>

  <!-- Kitap Kartları Vitrini -->
  <div id="results" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>

  <script>
    async function fetchBooks(query) {
      const status = document.getElementById('status');
      const grid = document.getElementById('results');
      status.textContent = `"${query}" taranıyor, canlı fiyatlar çekiliyor...`;
      grid.innerHTML = '<div class="text-xs text-stone-500 py-16 text-center col-span-full animate-pulse">Türkiye kütüphaneleri ve mağazaları taranıyor...</div>';

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();

        if (!data || data.length === 0) {
          grid.innerHTML = '<div class="text-xs text-stone-500 py-16 text-center col-span-full">Sonuç bulunamadı.</div>';
          status.textContent = "0 sonuç bulundu.";
          return;
        }

        status.textContent = `${data.length} gerçek kitap ve anlık mağaza fiyatı listelendi`;
        grid.innerHTML = data.map(b => `
          <div class="bg-stone-900 border border-stone-800 rounded-2xl p-3 flex flex-col justify-between shadow-md hover:border-stone-700 transition">
            <div class="flex gap-3">
              <img src="${b.image}" class="w-16 h-24 object-cover rounded-lg bg-stone-800 shrink-0 shadow" onerror="this.src='https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=400&q=80'">
              <div class="overflow-hidden flex-1 space-y-1">
                <h4 class="text-xs font-bold text-stone-100 line-clamp-2 leading-snug">${b.title}</h4>
                <p class="text-[11px] text-stone-400 truncate font-medium">${b.author}</p>
                <div class="inline-block px-2 py-0.5 bg-red-950/80 border border-red-800 text-red-300 text-[11px] font-bold rounded-lg mt-1">
                  ${b.price} TL
                </div>
              </div>
            </div>
            <div class="mt-3 pt-2 border-t border-stone-800/80 flex gap-1.5">
              <a href="${b.link}" target="_blank" class="flex-1 py-1.5 bg-stone-800 hover:bg-stone-700 text-center text-stone-200 text-[10px] font-bold rounded-xl transition">Kitapyurdu</a>
              <a href="https://www.trendyol.com/sr?q=${encodeURIComponent(b.title)}" target="_blank" class="flex-1 py-1.5 bg-amber-500/10 text-amber-300 text-center text-[10px] font-bold rounded-xl transition">Trendyol</a>
              <a href="https://www.hepsiburada.com/ara?q=${encodeURIComponent(b.title)}" target="_blank" class="flex-1 py-1.5 bg-orange-500/10 text-orange-300 text-center text-[10px] font-bold rounded-xl transition">H.Burada</a>
            </div>
          </div>
        `).join('');
      } catch (err) {
        status.textContent = "Bağlantı hatası.";
        grid.innerHTML = '<div class="text-xs text-red-400 py-16 text-center col-span-full">Arama motoruna ulaşılamadı.</div>';
      }
    }

    function doSearch() {
      const q = document.getElementById('q-input').value.trim();
      if (q) fetchBooks(q);
    }

    document.getElementById('q-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') doSearch();
    });

    function quickSearch(term) {
      document.getElementById('q-input').value = term;
      fetchBooks(term);
    }

    // Açılış
    fetchBooks('Beyza Alkoç');
  </script>
</body>
</html>
